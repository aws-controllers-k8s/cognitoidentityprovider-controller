ignore:
  shape_names:
      - AdvancedSecurityAdditionalFlowsType
      - SignInPolicyType
  resource_names:
      - Group
      - IdentityProvider
      - ManagedLoginBranding
      - UserImportJob
      - UserPoolDomain
  field_paths:
      - PasswordPolicyType.PasswordHistorySize
      - CreateUserPoolInput.UserPoolTier
      - CreateUserPoolOutput.UserPool.UserPoolTier
      - CreateUserPoolClientOutput.UserPoolClient.ClientSecret
      - DescribeUserPoolClientOutput.UserPoolClient.ClientSecret
      - UpdateUserPoolClientOutput.UserPoolClient.ClientSecret
sdk_names:
  model_name: cognito-identity-provider

resources:
  UserPool:
    exceptions:
        terminal_codes:
          - InvalidParameterException
    renames:
      operations:
        DescribeUserPool:
          input_fields:
            UserPoolId: Id
        UpdateUserPool:
          input_fields:
            UserPoolId: Id
        DeleteUserPool:
          input_fields:
            UserPoolId: Id
        CreateUserPool:
          input_fields:
            PoolName: Name
    fields:
      Tags:
        from:
          operation: TagResource
          path: Tags
      UserPoolTags:
        compare:
          is_ignored: true
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_create_post_set_output:
        template_path: hooks/user_pool/sdk_create_post_set_output.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/user_pool/sdk_read_one_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/user_pool/sdk_update_pre_build_request.go.tpl
  UserPoolClient:
    exceptions:
      terminal_codes:
        - InvalidParameterException
    tags:
      ignore: true
    renames:
      operations:
        CreateUserPoolClient:
          input_fields:
            ClientName: Name
            ClientId: Id
        UpdateUserPoolClient:
          input_fields:
            ClientName: Name
            ClientId: Id
        DescribeUserPoolClient:
          input_fields:
            ClientId: Id
          output_fields:
            ClientName: Name
        DeleteUserPoolClient:
          input_fields:
            ClientId: Id
    fields:
      Id:
        is_primary_key: true
      UserPoolId:
        is_immutable: true
        is_required: true
        references:
          resource: UserPool
          path: Status.ID
      GenerateSecret:
        is_immutable: true
  ResourceServer:
    exceptions:
      terminal_codes:
        - InvalidParameterException
    tags:
      ignore: true
    fields:
      Identifier:
        is_primary_key: true
        is_immutable: true
      UserPoolId:
        is_immutable: true
        is_required: true
        references:
          resource: UserPool
          path: Status.ID
