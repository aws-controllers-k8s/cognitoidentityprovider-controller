apiVersion: cognitoidentityprovider.services.k8s.aws/v1alpha1
kind: UserPoolClient
metadata:
  name: $USERPOOLCLIENT_NAME
spec:
  name: $USERPOOLCLIENT_NAME
  userPoolID: $USERPOOL_ID
  generateSecret: true
  clientSecretExportTo:
    name: $TARGET_SECRET_NAME
    key: clientSecret
  explicitAuthFlows:
    - ALLOW_USER_PASSWORD_AUTH
