apiVersion: cognitoidentityprovider.services.k8s.aws/v1alpha1
kind: UserPoolClient
metadata:
  name: $USERPOOLCLIENT_NAME
spec:
  name: $USERPOOLCLIENT_NAME
  userPoolID: $USERPOOL_ID
  clientSecret:
    name: $SOURCE_SECRET_NAME
    key: clientSecret
  explicitAuthFlows:
    - ALLOW_USER_PASSWORD_AUTH
